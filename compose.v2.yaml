name: odyssey-recommendation-v2-final
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: odyssey_v2_final_local
      POSTGRES_USER: local_v2
      POSTGRES_PASSWORD: ${LOCAL_V2_DB_PASSWORD:?Set LOCAL_V2_DB_PASSWORD in an ignored env file}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U local_v2 -d odyssey_v2_final_local']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - v2_postgres:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: Dockerfile.v2
    ports:
      - '127.0.0.1:8084:8080'
    environment:
      SPRING_PROFILES_ACTIVE: v2-local
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/odyssey_v2_final_local
      SPRING_DATASOURCE_USERNAME: local_v2
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_V2_DB_PASSWORD:?Set LOCAL_V2_DB_PASSWORD in an ignored env file}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  v2_postgres:
