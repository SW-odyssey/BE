# ---------------------------------------------------------------- #
# AI 기본 설정 (언어 및 페르소나)
# ---------------------------------------------------------------- #

# AI가 응답할 때 사용할 기본 언어를 설정합니다. (예: ko-KR, en-US)
language: ko-KR
# AI의 페르소나와 응답 톤앤매너를 상세하게 지시합니다. 최대 200자까지 작성할 수 있습니다.
tone_instructions: >
  Spring Boot · JPA 백엔드 팀의 시니어 리뷰어입니다.
  1. 문제의 원인과 고치는 방법을 함께 제시하세요.
  2. 근거가 되는 개념이나 공식 문서를 알려 주세요.
  3. 칭찬과 이모지는 생략하세요.

# ---------------------------------------------------------------- #
# 코드 리뷰 기능 세부 설정
# ---------------------------------------------------------------- #
reviews:
  # 리뷰의 전반적인 스타일을 설정합니다. 'chill'은 비교적 덜 엄격하고 부드러운 톤을 의미합니다.
  profile: chill
  # CodeRabbit의 코멘트를 모두 `resolve`하면, 자동으로 Approve를 하는 기능입니다.
  # PR은 2명의 리뷰어의 Approve 후 가능하다는 팀 컨벤션이 있기 때문에 false로 설정했습니다.
  request_changes_workflow: false
  # PR의 전체적인 변경 사항에 대한 고수준의 요약(summary)을 생성할지 여부입니다.
  high_level_summary: true
  # 변경된 각 파일에 대한 요약을 생성할지 여부입니다.
  # PR이 너무 길어지는 것을 방지하기 위해 비활성화했습니다.
  changed_files_summary: false
  # 코드의 실행 흐름을 보여주는 시퀀스 다이어그램을 생성할지 여부입니다.
  # PR이 너무 길어지는 것을 방지하기 위해 비활성화했습니다.
  sequence_diagrams: false
  # PR에 연결된 이슈(Issue)를 분석하여 리뷰 컨텍스트에 활용할지 여부입니다.
  assess_linked_issues: true
  # 연관된 다른 이슈를 찾아서 링크할지 여부입니다.
  related_issues: false
  # 연관된 다른 PR을 찾아서 링크할지 여부입니다.
  related_prs: false
  # PR에 적절한 레이블(e.g., 'bug', 'enhancement')을 제안할지 여부입니다.
  suggested_labels: false
  # 제안된 레이블을 자동으로 PR에 적용할지 여부입니다.
  auto_apply_labels: false
  # 이 PR을 리뷰할 만한 적절한 동료 리뷰어를 추천할지 여부입니다.
  suggested_reviewers: false
  # 추천된 리뷰어를 자동으로 할당할지 여부입니다.
  auto_assign_reviewers: false
  # 리뷰 요약에 위트 있는 시(poem)를 포함할지 여부입니다.
  # PR이 너무 길어지는 것을 방지하기 위해 비활성화했습니다.
  poem: false
  # 특정 파일 경로에 따라 다른 리뷰 지침을 적용합니다. 각 지침은 최대 2,000자입니다.
  # 공통 기준은 docs/be-code-convention.md 이고, 여기에는 경로마다 특히 볼 것만 적습니다.
  path_instructions:
    - path: "src/main/**"
      instructions: |
        1. docs/be-code-convention.md 와 PR 에 연결된 이슈의 API 명세를 기준으로 리뷰해주세요.
        2. API 값은 서버 enum 이름의 소문자입니다 (#28). 요청 파라미터나 응답 필드 이름이 이슈 명세와 다르면 지적해주세요.
        3. 엔티티는 analysis 저장소가 적재하고 BE 는 읽기만 합니다. 쓰기 메서드나 setter 가 생기면 지적해주세요.
        4. 외부 입력이 컨트롤러에서 허용 값까지 검증되는지, 잘못된 입력이 500 으로 새지 않는지 봐주세요.
        5. 피로감을 줄이기 위해 꼭 필요한 지적만 해당 라인에 남기고, 사소한 것은 요약에 모아주세요.
        6. 빠진 테스트가 있으면 어떤 테스트가 필요한지 계층(컨트롤러 · 서비스 · 리포지토리)과 함께 제안해주세요.
    - path: "src/test/**"
      instructions: |
        1. given / when / then 주석, 테스트 하나에 동작 하나, DisplayName 이 "상황 → 결과" 형식인지 봐주세요.
        2. 예외 검증은 catchThrowableOfType 으로 when 에서 받고 then 에서 검증하는지 봐주세요.
        3. 정렬 · 경계값 테스트가 해당 코드를 지웠을 때 실제로 깨지는지 봐주세요.
    - path: "src/main/resources/db/migration/**"
      instructions: |
        1. 이미 적용된 V 파일을 고치지 말고 새 버전으로 추가해야 합니다.
        2. 새 테이블에 row level security 를 켰는지 봐주세요.
        3. 엔티티와 컬럼 이름 · 타입 · null 여부가 맞는지 봐주세요 (ddl-auto: validate).

  # ---------------------------------------------------------------- #
  # 자동 리뷰 트리거 설정
  # ---------------------------------------------------------------- #
  auto_review:
    # PR이 생성되면 자동으로 리뷰를 시작합니다.
    # false로 두면 `@coderabbitai review` 코멘트를 남겨야 리뷰가 시작됩니다.
    enabled: true
    # 이미 리뷰가 진행된 PR에 새로운 커밋이 추가될 때, 변경된 부분에 대해서만 자동으로 리뷰를 진행할지 여부입니다.
    # 커밋마다 리뷰가 달리면 시끄러워서 껐습니다. 다시 보게 하려면 `@coderabbitai review` 를 남깁니다.
    auto_incremental_review: false

# ---------------------------------------------------------------- #
# 채팅 기능 설정
# ---------------------------------------------------------------- #
chat:
  # 사용자가 @coderabbitai 태그를 지정하지 않아도 자동으로 답글을 달 수 있도록 설정합니다.
  auto_reply: true

# ---------------------------------------------------------------- #
# CodeRabbit의 지식 기반(Knowledge Base) 설정
# ---------------------------------------------------------------- #
knowledge_base:
  # 웹 검색을 통해 최신 정보나 문서를 참조할 수 있도록 허용할지 여부입니다.
  web_search:
    enabled: true
  # 레포지토리 내의 특정 파일을 AI의 코드 스타일 가이드라인으로 사용하도록 설정합니다.
  code_guidelines:
    enabled: true
    filePatterns:
      - docs/be-code-convention.md
  # CodeRabbit이 대화나 리뷰를 통해 학습한 내용을 어디에 저장하고 참조할지 범위를 설정합니다. 'local'은 현재 레포지토리에 한정됨을 의미합니다.
  learnings:
    scope: local
  # 이슈 정보를 참조할 범위를 설정합니다.
  issues:
    scope: local
  # 풀 리퀘스트 정보를 참조할 범위를 설정합니다.
  pull_requests:
    scope: local
