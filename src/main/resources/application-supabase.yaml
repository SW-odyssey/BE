# Supabase Postgres(odyssey 프로젝트) 연결용. 접속 정보는 프로젝트 루트의 .env(.env.example 참고)나
# 같은 이름의 환경변수로 받고 저장소에 커밋하지 않는다. 둘 다 있으면 환경변수가 이긴다.
# 무료 플랜 Direct connection 은 IPv6 전용이라 Session pooler(5432)를 쓴다.
# Transaction pooler(6543)는 JDBC prepared statement 와 충돌할 수 있어 쓰지 않는다.
spring:
  config:
    # .env 는 KEY=VALUE 형식이라 properties 로 읽는다. 없으면 건너뛴다
    import: optional:file:.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  docker:
    compose:
      # 로컬 compose 의 postgres 를 띄우지 않는다
      enabled: false

  flyway:
    # Supabase 가 public 스키마에 rls_auto_enable 함수를 미리 만들어 둬서 Flyway 가 비어 있지 않은 스키마로 본다.
    # baseline 을 0 으로 잡아 V1 부터 전부 실행되게 한다. 이력 테이블이 생긴 뒤에는 이 설정이 동작하지 않는다
    baseline-on-migrate: true
    baseline-version: 0
